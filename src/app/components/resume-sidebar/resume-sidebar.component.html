<section class="side-section">
  <h2 style="font-family: 'Playfair Display', Georgia, serif; text-transform: uppercase; font-size: 22px">Skills</h2>

  <div class="skill-group" *ngFor="let group of skillGroups">
    <h3>{{ group.title }}</h3>
    <ul>
      <li *ngFor="let skill of group.items">{{ skill }}</li>
    </ul>
  </div>
</section>

<section class="side-section">
  <h2 style="font-family: 'Playfair Display', Georgia, serif; text-transform: uppercase; font-size: 22px">Certificates</h2>
  <ul class="certificate-list">
    <li *ngFor="let certificate of certificates">{{ certificate }}</li>
  </ul>
</section>

<section class="side-section">
  <h2 style="font-family: 'Playfair Display', Georgia, serif; text-transform: uppercase; font-size: 22px">Websites Public (Links)</h2>
  <ul>
    <li *ngFor="let link of weblink1"><a [href]="link" target="_blank">My Portfolio</a></li>
    <li *ngFor="let link of weblink2"><a [href]="link" target="_blank">Business Hub (Final Year Project mobile App Website)</a></li>
  </ul>
  

</section>
