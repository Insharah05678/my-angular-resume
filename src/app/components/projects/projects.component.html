<section class="resume-section" id="projects">
  <h2 style="font-family: 'Playfair Display', Georgia, serif; text-transform: uppercase; font-size: 22px">Projects</h2>


  <article class="project-item" *ngFor="let project of projects">
    <div class="project-title">
      <h3>{{ project.title }}</h3>
      <span>{{ project.type }}</span>
    </div>
    <p>{{ project.description }}</p>
  </article>
</section>
