<section class="resume-section" id="education">
  <h2>Education</h2>

  <div class="education-list">
    <article class="education-item" *ngFor="let item of education">
      <div>
        <h3>{{ item.institution }}</h3>
        <p>{{ item.degree }}</p>
      </div>
      <time>{{ item.dates }}</time>
    </article>
  </div>
</section>
